# Unofficial Redis Open Source 8.10 for Windows — console overlay.
#
# Full option list and comments: redis.conf (upstream 8.10).
# Ops notes: Redis on Windows.md
# Service CLI: Windows Service Documentation.md
#
# This file is a short Windows-specific overlay, not a fork of redis.conf.
# Unspecified keys keep the 8.10 defaults.

################################## NETWORK #####################################

# Loopback only. Comment bind to listen on all interfaces (also set a password
# or ACL — protected-mode will otherwise reject remote clients).
bind 127.0.0.1
protected-mode yes
port 6379

# AF_UNIX listen is M9. TCP is the supported path today.
# Minimum OS for unixsocket: Windows 10 1803 / Server 2019 (afunix.sys).
# unixsocket C:\Redis\redis.sock
# unixsocketperm 700

################################## GENERAL #####################################

# daemonize is a no-op on Windows (warning logged). Use --service-install.
daemonize no

# pidfile is optional in a console session.
# pidfile redis.pid

loglevel notice
logfile ""

# syslog-* maps to the Windows Event Log, not POSIX syslog.
# A process started as a service enables the Event Log automatically.
# syslog-enabled no
# syslog-ident redis

################################ SNAPSHOTTING ##################################

dir ./
dbfilename dump.rdb

# Upstream 8.10 defaults if omitted: 3600/1, 300/100, 60/10000.
# save 3600 1 300 100 60 10000

################################# MEMORY #######################################

# persistence-available no skips QFork init and deletes
# BGSAVE, BGREWRITEAOF, SYNC, PSYNC, REPLCONF, BACKUP.
# Pre-parsed from this file before QForkParentInit (include is followed).
persistence-available yes

# Always set maxmemory in production. There is no 5.0 --maxheap key in 8.10;
# the QFork reservation is 10x RAM (cap 1 TB) when persistence is on.
# See Redis on Windows.md (pagefile / ASLR / current jemalloc bypass).
# maxmemory 256mb
# maxmemory-policy noeviction

################################## AOF / BACKUP ################################

appendonly no
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
# BACKUP START/SEAL directory name (not a path).
backupdirname "backupdir"

################################## THREADS #####################################

# Leave at 1 until M9. Values > 1 are not recommended yet.
io-threads 1

################################## ACL / TLS ###################################

# Prefer an ACL file over putting --requirepass on an SCM ImagePath.
# aclfile redis.acl
# user default on nopass ~* &* +@all

# Default win-8.10 is built without OpenSSL (M8).
# tls-port 6379
