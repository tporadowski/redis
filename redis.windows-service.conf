# Unofficial Redis Open Source 8.10 for Windows — SCM overlay.
#
# Same keys as redis.windows.conf, with a file log + Event Log on.
# Install:
#   redis-server --service-install redis.windows-service.conf
# Full option list: redis.conf. Ops notes: Redis on Windows.md

################################## NETWORK #####################################

bind 127.0.0.1
protected-mode yes
port 6379

# unixsocket C:\Redis\redis.sock
# unixsocketperm 700

################################## GENERAL #####################################

# daemonize is a no-op; the Windows Service is the supported background form.
daemonize no

loglevel notice
logfile "server_log.txt"

# Event Log (Application / source redis). Also forced on when RunningAsService.
syslog-enabled yes
syslog-ident redis

################################ SNAPSHOTTING ##################################

dir ./
dbfilename dump.rdb

################################# MEMORY #######################################

persistence-available yes
# maxmemory 256mb
# maxmemory-policy noeviction

################################## AOF / BACKUP ################################

appendonly no
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
backupdirname "backupdir"

################################## THREADS #####################################

io-threads 1

################################## ACL / TLS ###################################

# aclfile redis.acl
# tls-port 6379
